services:
  web:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      PORT: 3000
    ports:
      - "127.0.0.1:${HOST_PORT:-3001}:3000"
    volumes:
      - app-data:/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
volumes:
  app-data:
