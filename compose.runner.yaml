services:
  runner:
    build:
      context: .
      dockerfile: Dockerfile.runner
    restart: unless-stopped
    env_file: .env.runner
    environment:
      HOST: 0.0.0.0
      MAYPLANE_DATA_DIR: /data
    ports:
      - "127.0.0.1:8788:8788"
    volumes:
      - runner-data:/data
    stop_grace_period: 65m
volumes:
  runner-data:
